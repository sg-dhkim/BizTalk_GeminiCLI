<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 (BizTone Converter)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 업무 말투 변환기</h1>
            <p>전달하고 싶은 내용을 입력하면 적절한 업무 언어로 바꿔드립니다.</p>
        </header>

        <main>
            <section class="selection-section">
                <h3>받는 사람</h3>
                <div class="target-buttons">
                    <button class="target-btn active" data-target="boss">👔 상사/임원</button>
                    <button class="target-btn" data-target="colleague">🤝 타팀 동료</button>
                    <button class="target-btn" data-target="client">🌐 고객/외부</button>
                    <button class="target-btn" data-target="team">👥 팀 내 동료</button>
                </div>
            </section>

            <section class="input-section">
                <textarea id="inputText" placeholder="내용을 편하게 입력하세요 (예: 내일까지 보고서 제출 어려움)"></textarea>
                <button id="convertBtn">변환하기</button>
            </section>

            <section class="output-section">
                <h3>변환 결과</h3>
                <div class="result-container">
                    <textarea id="outputText" readonly placeholder="변환 결과가 여기에 표시됩니다."></textarea>
                    <div id="loading" class="hidden">
                        <div class="spinner"></div>
                        <p>AI가 말투를 정성스럽게 변환 중입니다...</p>
                    </div>
                </div>
                <button id="copyBtn">복사하기 📋</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 BizTone Converter. Powered by Upstage Solar-Pro2.</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
