<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 (BizTone Converter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl shadow-slate-200/60 p-6 md:p-10 border border-slate-100">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-600 mb-3 flex items-center justify-center gap-2">
                <span>💼</span> 업무 말투 변환기
            </h1>
            <p class="text-slate-500 text-lg">전달하고 싶은 내용을 입력하면 적절한 업무 언어로 바꿔드립니다.</p>
        </header>

        <main class="space-y-8">
            <section>
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">받는 사람</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="targetButtonsContainer">
                    <button class="target-btn active px-4 py-3 rounded-xl border-2 border-slate-100 text-slate-600 hover:bg-slate-50 transition-all duration-200 font-medium text-sm flex items-center justify-center gap-2" data-target="boss">
                        👔 상사/임원
                    </button>
                    <button class="target-btn px-4 py-3 rounded-xl border-2 border-slate-100 text-slate-600 hover:bg-slate-50 transition-all duration-200 font-medium text-sm flex items-center justify-center gap-2" data-target="colleague">
                        🤝 타팀 동료
                    </button>
                    <button class="target-btn px-4 py-3 rounded-xl border-2 border-slate-100 text-slate-600 hover:bg-slate-50 transition-all duration-200 font-medium text-sm flex items-center justify-center gap-2" data-target="client">
                        🌐 고객/외부
                    </button>
                    <button class="target-btn px-4 py-3 rounded-xl border-2 border-slate-100 text-slate-600 hover:bg-slate-50 transition-all duration-200 font-medium text-sm flex items-center justify-center gap-2" data-target="team">
                        👥 팀 내 동료
                    </button>
                </div>
            </section>

            <section class="space-y-4">
                <div class="relative group">
                    <textarea id="inputText" class="w-full min-h-[160px] p-5 rounded-xl border-2 border-slate-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all outline-none text-lg resize-none placeholder:text-slate-300" placeholder="내용을 편하게 입력하세요 (예: 내일까지 보고서 제출 어려움)"></textarea>
                </div>
                <button id="convertBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white rounded-xl text-lg font-bold shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
                    변환하기
                </button>
            </section>

            <section class="space-y-4 pt-4 border-t border-slate-50">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">변환 결과</h3>
                    <button id="copyBtn" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-500 hover:bg-slate-200 rounded-lg transition-colors flex items-center gap-1.5">
                        <span>📋</span> 복사하기
                    </button>
                </div>
                <div class="relative">
                    <textarea id="outputText" readonly class="w-full min-h-[160px] p-5 rounded-xl border-2 border-slate-50 bg-slate-50 text-slate-700 text-lg outline-none resize-none placeholder:text-slate-400" placeholder="변환 결과가 여기에 표시됩니다."></textarea>
                    
                    <div id="loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-[2px] rounded-xl flex flex-col items-center justify-center z-10">
                        <div class="spinner w-10 h-10 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-3"></div>
                        <p class="text-blue-600 font-medium animate-pulse text-sm">AI가 말투를 정성스럽게 변환 중입니다...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="mt-12 text-center border-t border-slate-50 pt-8">
            <p class="text-slate-400 text-sm font-medium">
                &copy; 2026 BizTone Converter. <span class="text-slate-300 mx-2">|</span> Powered by <span class="text-slate-500">Upstage Solar-Pro2</span>
            </p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
