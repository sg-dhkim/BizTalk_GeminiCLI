<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 | BizTone Converter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 업무 말투 변환기</h1>
            <p>상황에 맞는 완벽한 비즈니스 말투로 바꿔보세요.</p>
        </header>

        <main>
            <section class="input-section">
                <label for="inputText">변환할 원문</label>
                <textarea id="inputText" placeholder="예: 내일까지 보고서 제출 어려울 것 같음"></textarea>
            </section>

            <section class="target-section">
                <label>수신 대상 선택</label>
                <div class="target-buttons">
                    <button type="button" class="target-btn" data-target="boss">상사 / 임원</button>
                    <button type="button" class="target-btn" data-target="colleague">타팀 동료</button>
                    <button type="button" class="target-btn" data-target="client">고객 / 외부</button>
                    <button type="button" class="target-btn active" data-target="team">팀 내 동료</button>
                </div>
            </section>

            <section class="action-section">
                <button id="convertBtn" class="primary-btn">변환하기</button>
            </section>

            <section id="loading" class="loading-section hidden">
                <div class="spinner"></div>
                <p>AI가 말투를 정중하게 다듬는 중입니다...</p>
            </section>

            <section class="result-section">
                <label for="outputText">변환 결과</label>
                <div class="textarea-wrapper">
                    <textarea id="outputText" readonly placeholder="변환 결과가 여기 표시됩니다."></textarea>
                    <button id="copyBtn" class="copy-btn">복사하기</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 BizTone Converter. Powered by Upstage Solar.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
